name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Setup App Icon
        run: |
          mkdir -p ClickerApp/Assets.xcassets/AppIcon.appiconset
          curl -s "https://i.ibb.co.com/xSS0tC6t/image.png" -o temp_logo.png
          sips -s format png -z 1024 1024 temp_logo.png --out ClickerApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          cat << 'EOF' > ClickerApp/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF
          cat << 'EOF' > ClickerApp/Assets.xcassets/Contents.json
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77/objectVersion = 60/g' ClickerApp.xcodeproj/project.pbxproj

      - name: Build Application (.app)
        run: |
          xcodebuild build \
            -project ClickerApp.xcodeproj \
            -scheme ClickerApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r nowera1n.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nowera1n-unsigned
          path: nowera1n.ipa
          retention-days: 7
