name: ClickerApp
options:
  bundleIdPrefix: com.example
  xcodeVersion: "15.4"
targets:
  ClickerApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ClickerApp
    settings:
      base:
        PRODUCT_NAME: nowera1n
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nowera1n
        INFOPLIST_FILE: ClickerApp/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "YES"
        AD_HOC_CODE_SIGNING_ALLOWED: "YES"
